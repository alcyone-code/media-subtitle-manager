name: Build and Publish Docker Image

on:
  push:
    branches:
      - beta
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build-and-push:
    # 테스트가 실패하면 이미지를 빌드/배포하지 않는다
    needs: test
    # PR에서는 테스트만 수행하고 이미지 배포는 하지 않는다 (fork PR의 시크릿 접근 차단)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Calculate App Version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "version=beta-b${{ github.run_number }}-$SHORT_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/media-subtitle-manager
          tags: |
            # v로 시작하는 git tag 푸시 시 latest 태그 생성
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # v로 시작하는 git tag 자체를 버전으로 매핑 (v1.0.0 등)
            type=semver,pattern={{version}}
            # beta 브랜치 푸시 시 beta 태그 생성
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            # 커밋 해시 태그 생성
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
